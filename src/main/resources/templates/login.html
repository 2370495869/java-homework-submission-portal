<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('登录')}"></head>
<body class="auth-page"><main class="auth-layout">
  <section class="auth-intro">
    <div class="brand brand-light"><span class="brand-mark">课</span><span><strong>课序</strong><small>课程作业平台</small></span></div>
    <p class="eyebrow">COURSEWORK, IN ORDER</p>
    <h1>让每一次<br><em>提交都有迹可循。</em></h1>
    <p class="intro-copy">课程、作业、截止时间与提交版本集中管理。教师看清进度，学生安心交付。</p>
    <div class="intro-note"><span class="note-dot"></span>以课程为中心，记录每一次作业进展</div>
  </section>
  <section class="auth-card">
    <div class="auth-card-heading"><p class="eyebrow">WELCOME BACK</p><h2>登录你的账户</h2><p>继续处理课程与作业。</p></div>
    <div class="alerts">
      <div class="alert alert-success" th:if="${notice != null}" th:text="${notice}"></div>
      <div class="alert alert-error" th:if="${param.error}">用户名或密码不正确。</div>
      <div class="alert alert-success" th:if="${param.logout}">你已安全退出。</div>
    </div>
    <form th:action="@{/login}" method="post" class="form-stack">
      <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="50" placeholder="输入用户名">
      <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="输入密码">
      <button class="button button-primary button-wide" type="submit">登录 <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">还没有账户？ <a th:href="@{/register}">注册学生账户</a></p>
    <div class="auth-footnote">管理员账户由部署环境配置，教师角色由管理员授予。</div>
  </section>
</main></body></html>
