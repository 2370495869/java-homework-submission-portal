spring:
  application:
    name: homework-submission-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homework_portal}
    username: ${DB_USERNAME:homework}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: lax

app:
  storage:
    directory: ${UPLOAD_DIR:./uploads}
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  bootstrap-admin:
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:管理员}
